<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>News card render example</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: Tahoma, Arial, sans-serif; color: #202838; padding: 90px 130px;
      background: radial-gradient(circle at 10% 8%, #fc466b33, transparent 28%),
                  radial-gradient(circle at 92% 88%, #3f5efb3d, transparent 34%),
                  linear-gradient(135deg, #e8edf8, #dfe5f1 42%, #eef1ed);
    }
    header { display: flex; justify-content: space-between; align-items: start; }
    h1 { margin: 0; font-size: 62px; }
    .subtitle { color: #a8c0df; font-size: 30px; margin-top: 12px; }
    .date { padding: 22px 32px; border: 2px solid #ffffff44; border-radius: 48px; font-size: 30px; background: #ffffff18; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 56px; }
    article { min-height: 340px; padding: 34px 44px; border-radius: 30px; border: 2px solid #ffffffdd; background: #ffffffb8; box-shadow: 0 18px 42px #3f5efb22, inset 0 1px 0 #ffffffe8; position: relative; }
    article::after { content: ""; position: absolute; right: 0; top: 25%; height: 50%; width: 6px; border-radius: 4px; background: var(--accent); }
    .source { color: #7dd3fc; font-size: 24px; direction: ltr; text-align: right; }
    h2 { font-size: 42px; line-height: 1.35; margin: 20px 0 12px; }
    p { color: #d7e6f7; font-size: 28px; line-height: 1.55; margin: 0; }
    footer { margin-top: 36px; color: #cfe0f5; font-size: 28px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>مهم‌ترین خبرها</h1>
      <div class="subtitle">خلاصه اخبار امروز</div>
    </div>
    <div class="date" id="date"></div>
  </header>

  <!-- JavaScript creates the story cards from data. -->
  <main class="grid" id="stories"></main>
  <footer id="sources"></footer>

  <script>
    const news = [
      {
        channel: "news_one",
        title: "وزیر اقتصاد از بسته جدید حمایت از تولید خبر داد",
        summary: "این بسته با هدف کاهش هزینه‌های تولید و تسهیل دسترسی بنگاه‌ها به منابع مالی اجرا می‌شود.",
        accent: "#4f8cff"
      },
      {
        channel: "news_two",
        title: "افتتاح مسیر جدید حمل‌ونقل در شمال کشور",
        summary: "با بهره‌برداری از این مسیر، زمان جابه‌جایی کالا میان چند شهر کاهش خواهد یافت.",
        accent: "#22d3ee"
      }
    ];

    // This is the only image input: Browser Run screenshots the resulting DOM.
    document.querySelector("#date").textContent = "۱۴۰۵/۰۷/۱۲ · ۱۵:۳۰";
    document.querySelector("#stories").innerHTML = news.map(item => `
      <article style="--accent:${item.accent}">
        <div class="source">@${escapeHtml(item.channel)}</div>
        <h2>${escapeHtml(item.title)}</h2>
        <p>${escapeHtml(item.summary)}</p>
      </article>
    `).join("");
    document.querySelector("#sources").textContent = "منابع: " + news.map(item => "@" + item.channel).join(" · ");

    function escapeHtml(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }
  </script>
</body>
</html>
